<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radio Kikao - Leading Kenya's Conversation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background: #0a0f2c;
      color: white;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1rem;
      transition: transform 0.3s ease;
    }

    .sidebar .material-icons {
      margin: 20px 0;
      cursor: pointer;
    }

    /* Toggle (hamburger) */
    .hamburger {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      background: #0a0f2c;
      color: white;
      border: none;
      padding: 0.5rem;
      z-index: 1001;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Main content */
    .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    /* Background image added below */
    background: url("kikaobanner.jpg") no-repeat center center;
    background-size: cover;
    color: white;
    padding: 1rem;
    overflow-y: auto;
    position: relative;
  }

    .stations {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .station {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: black;
      text-align: center;
      padding: 5px;
    }

    .host {
      text-align: center;
      margin-top: 2rem;
    }

    .host h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .host .live {
      background: red;
      color: white;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 5px;
    }

    .host img {
      width: 240px;
      height: 240px;
      border-radius: 10px;
      object-fit: cover;
      margin: 1rem auto 0;
      display: block;
    }

    .controls {
      background: white;
      color: black;
      padding: 0.7rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
    }

    .controls .buttons {
      display: flex;
      gap: 1rem;
    }

    .controls .buttons .material-icons {
      font-size: 28px;
      color: #0a0f2c;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        height: 100vh;
        transform: translateX(-100%);
        z-index: 1000;
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .hamburger {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Hamburger menu -->
  <button class="hamburger" onclick="toggleSidebar()">
    <span class="material-icons">menu</span>
  </button>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <span class="material-icons">home</span>
    <span class="material-icons">mic</span>
    <span class="material-icons">camera_alt</span>
    <span class="material-icons">ondemand_video</span>
    <span class="material-icons">podcasts</span>
    <span class="material-icons">music_note</span>
    <span class="material-icons">library_books</span>
    <span class="material-icons">settings</span>
  </div>

  <!-- Main content -->
  <div class="main">
    <div class="stations">
      <div class="station">Radio Kikao</div>
    </div>

    <div class="host">
      <div class="live">LIVE</div>
      <h2>Radio Kikao</h2>
      <!-- Your square logo goes here -->
      <img src="Kikao White.jpg" alt="Station Logo">
    </div>
  </div>

  <!-- Audio Player -->
  <audio id="audioPlayer" src="https://stream.zeno.fm/cvcdrewojueuv" preload="auto"></audio>

  <!-- Controls -->
  <div class="controls">
    <div class="track-info">
      <strong>Radio Kikao</strong><br>
      <small>Live • Nairobi • 2025</small>
    </div>

    <div class="buttons">
      <span class="material-icons" onclick="rewind()">replay_10</span>
      <span class="material-icons" onclick="togglePlay()" id="playIcon">play_arrow</span>
      <span class="material-icons" onclick="forward()">forward_30</span>
    </div>

    <div class="volume">
      <span class="material-icons" onclick="toggleMute()" id="volumeIcon">volume_up</span>
    </div>
  </div>

  <!-- Script -->
  <script>
    const audio = document.getElementById('audioPlayer');
    const playIcon = document.getElementById('playIcon');
    const volumeIcon = document.getElementById('volumeIcon');

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.textContent = 'pause';
      } else {
        audio.pause();
        playIcon.textContent = 'play_arrow';
      }
    }

    function rewind() {
      audio.currentTime -= 10;
    }

    function forward() {
      audio.currentTime += 30;
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      volumeIcon.textContent = audio.muted ? 'volume_off' : 'volume_up';
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('show');
    }

    window.addEventListener('load', () => {
      audio.volume = 0.7;
    });
  </script>
</body>
</html>
